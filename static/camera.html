<!DOCTYPE html>
<html>
<head>
    <title>Realtime python OCR</title>
    <style>
        body { 
            margin: 0; 
            background: white; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start;
			padding-top: 20px;
            height: 100vh;
        }
        video { 
            width: 100%; 
            max-width: 640px; 
            border: 2px solid #333; 
        }
        #status { 
            margin-top: 10px; 
            color: #0f0; 
            font-size: 1.2rem;
        }

		#ocrBox {
            width: 100%;
            max-width: 640px;
            margin-top: 12px;
            border: 2px solid #333;
            padding: 10px;
            box-sizing: border-box;
            background: #f7f7f7;
        }
		#ocrTitle {
            font-weight: 700;
            margin-bottom: 8px;
            color: #111;
			font-size: 2rem;
        }

        #ocrText {
            margin: 0;
            white-space: pre-wrap; 
            word-break: break-word;
            color: #111;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 2rem;
            max-height: 35vh;    
            overflow: auto;
        }

    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    
    <div id="status">Starting camera...</div>

	<div id="ocrBox">
        <div id="ocrTitle">Recognized text</div>
        <pre id="ocrText">Waiting for text...</pre>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusDiv = document.getElementById('status');
		const ocrTextEl = document.getElementById('ocrText');
        const context = canvas.getContext('2d');

        // start the Camera
        async function startCamera() {
            try {
                // get the rear camera (environment)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" } } 
                }).catch(e => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });

                video.srcObject = stream;
                statusDiv.innerText = "Camera Active. Sending frames...";
                
                // Start the loop to send images and load text
                setInterval(sendFrame, 500); // Send every 500ms (2 times per second)
				setInterval(loadTxt, 700); // Load text every 700ms (slightly offset from image sending)

            } catch (err) {
                statusDiv.innerText = "Error: " + err.message;
                statusDiv.style.color = "red";
            }
        }

        // capture and upload the Image
        function sendFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // resize
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // Draw the current video frame to the canvas
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Convert canvas to a Blob and upload
                canvas.toBlob((blob) => {
                    const formData = new FormData();
                    formData.append('file', blob, 'image.jpg');

                    // send to backend
                    fetch('/frame', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        statusDiv.innerText = `Sent: ${data.width}x${data.height} px`;
                        statusDiv.style.opacity = (statusDiv.style.opacity === '1' ? '0.7' : '1');
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        statusDiv.innerText = "Upload failed (Check PC console)";
                        statusDiv.style.color = "orange";
                    });
                }, 'image/jpeg', 0.7); 
            }
        }
		// Load recognized text from the server
		async function loadTxt() {
            try {
                const res = await fetch('/text', { cache: 'no-store' });
                if (!res.ok) return;

                const txt = await res.text();
                ocrTextEl.textContent = txt.trim() ? txt : "No text yet...";
            } catch (e) {
                ocrTextEl.textContent = "Could not load text.";
            }
        }

        // Initialize
        startCamera();
    </script>
</body>
</html>
