<!DOCTYPE html>
<html>
<head>
    <title>Realtime python OCR</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <video id="video" autoplay playsinline muted></video>
    <div id="status">Starting camera...</div>

    <div id="ocrBox">
        <div id="ocrTitle">Recognized text</div>
        <pre id="ocrText">Waiting for text...</pre>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusDiv = document.getElementById('status');
        const ocrTextEl = document.getElementById('ocrText');
        const context = canvas.getContext('2d', { alpha: false });

        let isSending = false;
        let latestRequestId = 0;
        let latestDisplayedRequestId = 0;
        let stopped = false;

        const MAX_WIDTH = 960;
        const JPEG_QUALITY = 0.6;
        const IDLE_DELAY_MS = 80; // delay between requests

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;

                await new Promise((resolve) => {
                    video.onloadedmetadata = () => resolve();
                });

                await video.play();

                statusDiv.innerText = "Camera active. Sending live frames...";
                statusDiv.style.color = "green";

                processingLoop();
            } catch (err) {
                statusDiv.innerText = "Error: " + err.message;
                statusDiv.style.color = "red";
            }
        }
        // Utility function to scale dimensions while preserving aspect ratio
        function getScaledSize(srcW, srcH, maxW) {
            if (srcW <= maxW) {
                return { width: srcW, height: srcH };
            }
            const scale = maxW / srcW;
            return {
                width: Math.round(srcW * scale),
                height: Math.round(srcH * scale)
            };
        }
        // Convert canvas to Blob using a Promise-based wrapper
        function canvasToBlob(canvas, type, quality) {
            return new Promise((resolve) => {
                canvas.toBlob(resolve, type, quality);
            });
        }
        // Sends the latest video frame to the server for OCR processing
        async function sendLatestFrame() {
            if (isSending || stopped) return;
            if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;

            isSending = true;
            const requestId = ++latestRequestId;
            const startedAt = performance.now();

            try {
                const srcW = video.videoWidth;
                const srcH = video.videoHeight;
                const { width, height } = getScaledSize(srcW, srcH, MAX_WIDTH);

                canvas.width = width;
                canvas.height = height;
                context.drawImage(video, 0, 0, width, height);

                const blob = await canvasToBlob(canvas, 'image/jpeg', JPEG_QUALITY);
                if (!blob) throw new Error("Could not encode frame");

                const formData = new FormData();
                formData.append('file', blob, 'image.jpg');
                formData.append('requestId', String(requestId));

                const response = await fetch('/frame', {
                    method: 'POST',
                    body: formData,
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                const elapsed = Math.round(performance.now() - startedAt);

                statusDiv.innerText = `Live OCR • sent ${width}x${height}px • ${elapsed} ms`;

                // Only display the newest completed result
                if (requestId >= latestDisplayedRequestId) {
                    latestDisplayedRequestId = requestId;
                    const text = (data.text || "").trim();
                    ocrTextEl.textContent = text || "No text found in this frame.";
                }
            } catch (error) {
                console.error('Error sending frame:', error);
                statusDiv.innerText = "Upload/OCR failed: " + error.message;
                statusDiv.style.color = "red";
            } finally {
                isSending = false;
            }
        }
        // Main loop to continuously send frames at a controlled rate
        async function processingLoop() {
            while (!stopped) {
                if (!isSending) {
                    await sendLatestFrame();
                }
                await new Promise(resolve => setTimeout(resolve, IDLE_DELAY_MS));
            }
        }

        startCamera();
    </script>
</body>
</html>
